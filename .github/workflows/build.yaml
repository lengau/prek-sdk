name: Build SDK

on:
  pull_request:
    branches:
      # Version branches maintained by Renovate (see renovate.json).
      - "[0-9]+.[0-9]+"
  push:
    branches:
      - "[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: canonical/sdkcraft-actions/.github/workflows/build.yml@main
